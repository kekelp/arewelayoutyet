<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Compare the capabilities of Rust UI layout libraries.">
  <meta name="color-scheme" content="dark">
  <title>Are we layout yet?</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="shell"><a class="brand" href="./"><span class="logo" aria-hidden="true">▦</span> are we layout yet?</a></header>
  <main class="shell">
    <section aria-labelledby="benchmark-heading">
      <div class="benchmark-heading">
        <h2 id="benchmark-heading">Benchmarks</h2>
        <div class="benchmark-actions small">
          <a href="data/history.json" download>Download JSON</a>
          <span>Generated on <time datetime="{{generated-at}}">{{generated-date}}</time> (UTC)</span>
          <a href="https://github.com/marc2332/arewelayoutyet">Source on GitHub</a>
        </div>
      </div>
      <p id="benchmark-status" class="small" role="status">Loading measurements…</p>
      <div id="benchmark-content" hidden>
        <label class="run-selector">Run <select id="benchmark-run"></select></label>
        <div class="table-scroll" tabindex="0" role="region" aria-label="Layout benchmark results"><table id="benchmark-results"></table></div>
        <p id="run-details" class="small"></p>
      </div>
    </section>
    <section aria-label="Library capabilities">
      <div class="legend"><span class="yes">● Supported</span><span class="partial">◐ Partial</span><span class="different">≈ Different model</span><span class="no">○ Not supported</span><span class="unknown">? Unverified</span></div>
      <div class="table-scroll" tabindex="0" role="region" aria-label="Library feature comparison"><table id="features"><caption>Loading library features…</caption></table></div>
    </section>
    <noscript><p>JavaScript is needed to render the comparison. The <a href="data/features.json">feature matrix JSON</a> remains available directly.</p></noscript>
  </main>
</body>
</html>
