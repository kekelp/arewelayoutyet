name: Daily benchmarks and website

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: benchmark-history-and-deployment
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  benchmark:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: benchmarks
      - name: Download release history or initialize the first run
        run: node scripts/history.mjs download
      - name: Run the shared layout workloads
        run: cargo bench --manifest-path benchmarks/Cargo.toml --locked --bench pangui --features morphorm,torin -- --noplot
      - name: Append this run to the full history
        run: node scripts/collect.mjs
      - name: Build the static site
        run: node scripts/build.mjs
      - name: Stage the archive recovery files
        run: |
          mkdir -p .history/backup/site/data .history/backup/.history
          cp site/data/history.json .history/backup/site/data/
          if [ -f .history/previous-history.json.gz ]; then
            cp .history/previous-history.json.gz .history/backup/.history/
          fi
      - name: Back up old and new history before replacing the asset
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-history-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: .history/backup/
          retention-days: 90
          if-no-files-found: error
      - name: Replace and verify the release archive
        run: node scripts/history.mjs upload
      - name: Preserve Criterion estimates and benchmark metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: criterion-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            benchmarks/target/criterion/**/new/estimates.json
            benchmarks/target/criterion/**/new/benchmark.json
          retention-days: 30
          if-no-files-found: ignore
      - name: Save the generated website for deployment
        uses: actions/upload-artifact@v4
        with:
          name: website
          path: dist
          retention-days: 7
          if-no-files-found: error

  deploy:
    needs: benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: production
      url: ${{ steps.deployment.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check deployment credentials
        run: |
          for variable in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!variable}" ]; then
              echo "::error::Missing GitHub Actions secret: $variable"
              exit 1
            fi
          done
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: website
          path: dist
      - name: Install Vercel CLI
        run: npm install --global vercel@64.7.0
      - name: Load the Vercel project settings
        run: vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
      - name: Prepare the prebuilt static deployment
        run: node scripts/prepare-vercel.mjs
      - name: Deploy to Vercel
        id: deployment
        run: |
          deployment_url="$(vercel deploy --prebuilt --prod --yes --token "$VERCEL_TOKEN")"
          printf 'url=%s\n' "$deployment_url" >> "$GITHUB_OUTPUT"
